name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all modules
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/**/target/surefire-reports/
          if-no-files-found: ignore
  container-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-identity, product-catalog, promo-coupon, ingestion-edge, inventory-cache, order-processing, payment-gateway, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: salestop/${{ matrix.service }}:ci
