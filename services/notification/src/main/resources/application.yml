server:
  port: 8088

spring:
  application:
    name: notification
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:h2:mem:notifications;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:sa}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:}
    driver-class-name: ${NOTIFICATION_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
