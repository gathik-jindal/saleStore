server:
  port: 8087

spring:
  application:
    name: payment-gateway
  datasource:
    url: ${PAYMENT_DATASOURCE_URL:jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${PAYMENT_DATASOURCE_USERNAME:sa}
    password: ${PAYMENT_DATASOURCE_PASSWORD:}
    driver-class-name: ${PAYMENT_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
