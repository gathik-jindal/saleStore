server.port: 8086
spring:
  application.name: order-processing
  datasource:
    url: ${ORDER_DATASOURCE_URL:jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${ORDER_DATASOURCE_USERNAME:sa}
    password: ${ORDER_DATASOURCE_PASSWORD:}
    driver-class-name: ${ORDER_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.salestop.common.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include: health,info,prometheus
