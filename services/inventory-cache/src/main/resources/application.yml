server:
  port: 8085

spring:
  application:
    name: inventory-cache
  datasource:
    url: ${INVENTORY_DATASOURCE_URL:jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${INVENTORY_DATASOURCE_USERNAME:sa}
    password: ${INVENTORY_DATASOURCE_PASSWORD:}
    driver-class-name: ${INVENTORY_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

inventory:
  idempotency-ttl: ${INVENTORY_IDEMPOTENCY_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
