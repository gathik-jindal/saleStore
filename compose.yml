x-service: &service
  restart: unless-stopped
  networks: [salestop]
  depends_on:
    kafka: {condition: service_healthy}
    redis: {condition: service_healthy}
    postgres: {condition: service_healthy}
  environment: &common-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    REDIS_HOST: redis
    SALESTOP_ADMIN_KEY: ${SALESTOP_ADMIN_KEY:-local-admin-key}
    SALESTOP_INTERNAL_KEY: ${SALESTOP_INTERNAL_KEY:-local-internal-key}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salestop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U salestop"], interval: 5s, timeout: 3s, retries: 20}
    networks: [salestop]

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    networks: [salestop]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"], interval: 5s, timeout: 5s, retries: 30}
    networks: [salestop]

  user-identity:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: user-identity}}
    ports: ["8081:8081", "9091:9091"]
    environment:
      <<: *common-env
      IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity
      IDENTITY_DATASOURCE_USERNAME: salestop
      IDENTITY_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
      IDENTITY_DATASOURCE_DRIVER: org.postgresql.Driver

  product-catalog:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: product-catalog}}
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      CATALOG_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_DATASOURCE_USERNAME: salestop
      CATALOG_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
      CATALOG_DATASOURCE_DRIVER: org.postgresql.Driver

  promo-coupon:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: promo-coupon}}
    ports: ["8083:8083"]
    environment:
      <<: *common-env
      PROMO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promo
      PROMO_DATASOURCE_USERNAME: salestop
      PROMO_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
      PROMO_DATASOURCE_DRIVER: org.postgresql.Driver

  inventory-cache:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: inventory-cache}}
    ports: ["8085:8085", "9095:9095"]

  ingestion-edge:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: ingestion-edge}}
    ports: ["8084:8084"]
    environment:
      <<: *common-env
      INVENTORY_GRPC_HOST: inventory-cache
      INVENTORY_GRPC_PORT: 9095
      CATALOG_URL: http://product-catalog:8082
      PROMO_URL: http://promo-coupon:8083
      JWKS_URI: http://user-identity:8081/.well-known/jwks.json

  order-processing:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: order-processing}}
    ports: ["8086:8086"]
    environment:
      <<: *common-env
      ORDER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      ORDER_DATASOURCE_USERNAME: salestop
      ORDER_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
      ORDER_DATASOURCE_DRIVER: org.postgresql.Driver

  payment-gateway:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: payment-gateway}}
    ports: ["8087:8087"]
    environment:
      <<: *common-env
      PAYMENT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENT_DATASOURCE_USERNAME: salestop
      PAYMENT_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salestop_dev}
      PAYMENT_DATASOURCE_DRIVER: org.postgresql.Driver
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-secret}

  notification:
    <<: *service
    build: {context: ., dockerfile: docker/Dockerfile, args: {SERVICE: notification}}
    ports: ["8088:8088"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [salestop]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    environment: {GF_SECURITY_ADMIN_PASSWORD: salestop}
    ports: ["3000:3000"]
    networks: [salestop]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
networks:
  salestop:
