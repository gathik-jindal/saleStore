imageRegistry: ghcr.io/your-github-user
imageTag: latest
imagePullPolicy: IfNotPresent

config:
  kafkaBootstrapServers: kafka:9092
  redisHost: redis-master
  postgresHost: postgres
  jwtIssuer: salestop-user-identity

secrets:
  postgresUsername: salestop
  postgresPassword: replace-me
  adminKey: replace-me
  internalKey: replace-me
  webhookSecret: replace-me

services:
  user-identity:
    port: 8081
    replicas: 1
    env:
      IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity
      IDENTITY_DATASOURCE_DRIVER: org.postgresql.Driver
  product-catalog:
    port: 8082
    replicas: 2
    env:
      CATALOG_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_DATASOURCE_DRIVER: org.postgresql.Driver
  promo-coupon:
    port: 8083
    replicas: 2
    env:
      PROMO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promo
      PROMO_DATASOURCE_DRIVER: org.postgresql.Driver
  ingestion-edge:
    port: 8084
    replicas: 3
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 50, cpu: 70}
    env:
      INVENTORY_GRPC_HOST: inventory-cache
      INVENTORY_GRPC_PORT: "9095"
      CATALOG_URL: http://product-catalog:8082
      PROMO_URL: http://promo-coupon:8083
      JWKS_URI: http://user-identity:8081/.well-known/jwks.json
  inventory-cache:
    port: 8085
    grpcPort: 9095
    replicas: 3
    autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 30, cpu: 70}
  order-processing:
    port: 8086
    replicas: 2
    keda: {enabled: true, minReplicas: 2, maxReplicas: 30, lagThreshold: "5000"}
    env:
      ORDER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      ORDER_DATASOURCE_DRIVER: org.postgresql.Driver
  payment-gateway:
    port: 8087
    replicas: 2
    env:
      PAYMENT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENT_DATASOURCE_DRIVER: org.postgresql.Driver
  notification:
    port: 8088
    replicas: 2

ingress:
  enabled: false
  className: nginx
  host: api.salestop.example
